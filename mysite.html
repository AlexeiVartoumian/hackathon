<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown to May 9th</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --ink: #1a1208;
    --rust: #c4501a;
    --gold: #d4a843;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Courier Prime', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 20%, rgba(212,168,67,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(196,80,26,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Grain texture */
  body::after {
    content: '';
    position: fixed;
    inset: -50%;
    width: 200%;
    height: 200%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 1;
  }

  .container {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
  }

  .label {
    font-family: 'Courier Prime', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--rust);
    margin-bottom: 1.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.2s;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 0.25rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.4s;
  }

  .year {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1rem, 3vw, 1.8rem);
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 3rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.5s;
  }

  .divider {
    width: 80px;
    height: 1px;
    background: var(--rust);
    margin: 0 auto 3rem;
    opacity: 0;
    animation: expandWidth 0.8s ease forwards 0.6s;
  }

  .countdown {
    display: flex;
    gap: clamp(1.5rem, 4vw, 3.5rem);
    align-items: flex-start;
    justify-content: center;
    margin-bottom: 3rem;
    flex-wrap: wrap;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards;
  }
  .unit:nth-child(1) { animation-delay: 0.7s; }
  .unit:nth-child(2) { animation-delay: 0.8s; }
  .unit:nth-child(3) { animation-delay: 0.9s; }
  .unit:nth-child(4) { animation-delay: 1.0s; }

  .number {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 400;
    color: var(--ink);
    line-height: 1;
    min-width: 2ch;
    transition: transform 0.15s ease;
  }

  .number.tick {
    transform: scale(1.06);
  }

  .unit-label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--rust);
  }

  .colon {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    color: var(--gold);
    line-height: 1;
    margin-top: 0;
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 0.75s;
  }

  .message {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(26,18,8,0.4);
    opacity: 0;
    animation: fadeUp 0.8s ease forwards 1.1s;
  }

  .arrived {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 6vw, 4rem);
    color: var(--rust);
    opacity: 0;
    animation: fadeUp 1s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes expandWidth {
    from { opacity: 0; width: 0; }
    to { opacity: 1; width: 80px; }
  }
</style>
</head>
<body>
<div class="container">
  <p class="label">Counting down to</p>
  <h1>May 9</h1>
  <p class="year">2025</p>
  <div class="divider"></div>
  <div class="event-title" style="opacity:0;animation:fadeUp 0.8s ease forwards 0.1s;margin-bottom:2rem;">
  <p style="font-family:'Courier Prime',monospace;font-size:1.7rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem;">Birkbecks</p>
  <h2 style="font-family:'Playfair Display',serif;font-size:clamp(1.5rem,5vw,3rem);font-weight:700;color:var(--ink);line-height:1.1;">First Ever<br>Hackathon</h2>
  <span style="display:inline-block;margin-top:0.6rem;background:var(--rust);color:var(--cream);font-family:'Courier Prime',monospace;font-size:0.65rem;letter-spacing:0.25em;text-transform:uppercase;padding:0.3rem 0.8rem;">Historic</span>
</div>
  <div class="countdown" id="countdown">
    <div class="unit">
      <div class="number" id="days">--</div>
      <div class="unit-label">Days</div>
    </div>
    <div class="colon">:</div>
    <div class="unit">
      <div class="number" id="hours">--</div>
      <div class="unit-label">Hours</div>
    </div>
    <div class="colon">:</div>
    <div class="unit">
      <div class="number" id="minutes">--</div>
      <div class="unit-label">Minutes</div>
    </div>
    <div class="colon">:</div>
    <div class="unit">
      <div class="number" id="seconds">--</div>
      <div class="unit-label">Seconds</div>
    </div>
  </div>
  <p class="message" id="message">The moment approaches</p>
</div>

<script>
  function getTarget() {
    const now = new Date();
    let year = now.getFullYear();
    const target = new Date(year, 4, 9, 0, 0, 0); // May = month 4
    if (now >= target) {
      // Check if it's today
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const targetDay = new Date(year, 4, 9);
      if (today.getTime() === targetDay.getTime()) return { target, arrived: true };
      target.setFullYear(year + 1);
    }
    return { target, arrived: false };
  }

  function pad(n) { return String(Math.max(0, n)).padStart(2, '0'); }

  function tick(el, newVal) {
    if (el.textContent !== newVal) {
      el.textContent = newVal;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
      setTimeout(() => el.classList.remove('tick'), 150);
    }
  }

  function update() {
    const { target, arrived } = getTarget();
    const now = new Date();
    const diff = target - now;

    if (arrived || diff <= 0) {
      document.getElementById('countdown').innerHTML = '<p class="arrived">It\'s May 9th! 🎉</p>';
      document.getElementById('message').textContent = 'The day has come';
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    // Update target year shown
    document.querySelector('.year').textContent = target.getFullYear();

    tick(document.getElementById('days'), pad(days));
    tick(document.getElementById('hours'), pad(hours));
    tick(document.getElementById('minutes'), pad(minutes));
    tick(document.getElementById('seconds'), pad(seconds));
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
